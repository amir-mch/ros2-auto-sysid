# Default Physical Parameters for 1:10 Scale Ackermann Vehicle (F1TENTH / RoboRacer)
/**:
  ros__parameters:
    dynamics:
      # Inertial parameters
      mass: 3.4000            # Total vehicle mass [kg]
      yaw_inertia: 0.0450     # Yaw moment of inertia around CG [kg*m^2]
      
      # Geometry (CG to front/rear axles)
      l_f: 0.1600             # Distance from CG to front axle [m]
      l_r: 0.1700             # Distance from CG to rear axle [m]
      wheelbase: 0.3300       # Total wheelbase l_f + l_r [m]
      track_width: 0.2000     # Track width [m]
      
      # Tire Cornering Characteristics (Linear Tire Model)
      c_f: 75.0000            # Front axle cornering stiffness [N/rad]
      c_r: 85.0000            # Rear axle cornering stiffness [N/rad]
      
      # Drivetrain & Aerodynamic Resistance
      motor_gain: 20.0000     # Motor drive velocity gain [N*s/m]
      drag_coeff: 0.2500      # Aerodynamic drag coefficient [N*s^2/m^2]
      
      # Actuator Dynamics
      steering_tau: 0.0700    # Steering servo first-order lag time constant [s]
